name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v4

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # МЕНЯЕМ GRADLE НА 4.10.3 (он нужен для anatawa12)
    - name: Устанавливаем Gradle 4.10.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '4.10.3'
        cache-disabled: true

    - name: Собираем мод
      run: gradle build --stacktrace

    - name: Загружаем готовый .jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
