name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v4

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Устанавливаем Gradle 2.14.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '2.14.1'
        cache-disabled: true

    # ФИКС: Теперь мы кладем файл ПОСЛЕ установки Gradle, чтобы он не удалился
    - name: Фикс мертвой ссылки Minecraft 1.7.10
      run: |
        mkdir -p ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10
        curl -L -o ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar https://launcher.mojang.com/v1/objects/e80d9b3bf564b1b04e086fb30bca035f6bfd9d9a/client.jar
        cp ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/1.7.10.jar

    - name: Собираем мод
      run: gradle build --stacktrace

    - name: Загружаем готовый .jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
