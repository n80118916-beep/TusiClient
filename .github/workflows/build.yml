name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v4

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # ВРУЧНУЮ СКАЧИВАЕМ GRADLE (обходим ошибку кэша)
    - name: Скачиваем Gradle 2.14.1
      run: |
        wget https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
        unzip -q gradle-2.14.1-bin.zip

    - name: Собираем мод
      run: ./gradle-2.14.1/bin/gradle build

    - name: Загружаем готовый .jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
