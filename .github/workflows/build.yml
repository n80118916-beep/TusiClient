name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v4

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # ФИКС: Скачиваем клиент 1.7.10 вручную и кладем в кэш Gradle
    - name: Фикс скачивания клиента 1.7.10 (Мертвая ссылка S3)
      run: |
        mkdir -p ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10
        wget -q https://launcher.mojang.com/v1/objects/e80d9b3bf564b1b04e086fb30bca035f6bfd9d9a/client.jar -O ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar

    - name: Устанавливаем Gradle 2.14.1 (без кэша)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '2.14.1'
        cache-disabled: true

    - name: Собираем мод
      run: gradle build --stacktrace

    - name: Загружаем готовый .jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
