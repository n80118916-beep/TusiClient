name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v4

    - name: Автоматически исправляем структуру папок
      run: |
        # Если есть папка TusicClient, копируем всё из нее в корень и удаляем
        if [ -d "TusicClient" ]; then
          cp -r TusicClient/* . || true
          rm -rf TusicClient
        fi
        
        # Создаем правильную папку для кода
        mkdir -p src/main/java/ru/tusiclient
        
        # Если java файлы лежат просто в корне, переносим их в правильную папку
        if ls *.java 1> /dev/null 2>&1; then
          mv *.java src/main/java/ru/tusiclient/ || true
        fi

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Устанавливаем Gradle 4.10.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '4.10.3'
        cache-disabled: true

    - name: Собираем мод
      run: gradle build --stacktrace

    - name: Загружаем готовый .jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
